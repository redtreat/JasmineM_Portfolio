<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inclusive AAC Communicator - Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; 
            overscroll-behavior-y: none;
            touch-action: pan-y; /* Prevent zooming, allow safe scrolling */
        }
        
        /* High-contrast focus rings for Keyboard & NVDA navigation */
        button:focus-visible {
            outline: 4px solid #2563eb;
            outline-offset: 4px;
            z-index: 10;
        }

        .aac-btn {
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            user-select: none;
            -webkit-user-select: none;
        }
        
        .aac-btn:active {
            transform: scale(0.95);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        /* Fitzgerald Key Color Coding */
        .color-pronoun { background-color: #fef08a; border-bottom: 4px solid #eab308; color: #422006; } /* Yellow */
        .color-verb { background-color: #bbf7d0; border-bottom: 4px solid #22c55e; color: #064e3b; } /* Green */
        .color-noun { background-color: #fdba74; border-bottom: 4px solid #f97316; color: #431407; } /* Orange */
        .color-social { background-color: #fbcfe8; border-bottom: 4px solid #ec4899; color: #500724; } /* Pink */
        .color-adj { background-color: #bfdbfe; border-bottom: 4px solid #3b82f6; color: #1e3a8a; } /* Blue */
        .color-prep { background-color: #d8b4fe; border-bottom: 4px solid #a855f7; color: #3b0764; } /* Purple */
        .color-question { background-color: #f3f4f6; border-bottom: 4px solid #9ca3af; color: #1f2937; } /* Gray */
        
        /* Folder Styling to visually distinguish categories from words */
        .color-folder { 
            background-color: #e5e7eb; 
            border-bottom: 4px solid #9ca3af; 
            border-top: 4px solid #d1d5db;
            color: #1f2937; 
        }

        /* Hide scrollbar for a cleaner interface but allow scrolling */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>

                        <span>Clear</span>
                    </button>
                    <button id="btn-speak-sentence" onclick="speakSentence()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-sm transition-colors text-sm md:text-base flex flex-col items-center justify-center gap-1 col-span-3 md:col-span-1" aria-label="Speak entire sentence">

            { id: 'pers_family', word: 'Family', type: 'color-noun', file: 'images/word_family.png', fallback: '👨‍👩‍👧‍👦', category: 'cat_personal' },

        let sentence = [];
        let currentViewId = 'home'; 
        
        const synth = window.speechSynthesis;
        const announcer = document.getElementById('a11y-announcer');
        const gridElement = document.getElementById('vocabulary-grid');
        const sentenceStrip = document.getElementById('sentence-strip');
        const emptyState = document.getElementById('empty-state');
        const navBar = document.getElementById('navigation-bar');
        const currentCategoryTitle = document.getElementById('current-category-title');
        const btnHome = document.getElementById('btn-home');

        
        // Renders either the Home view (Core + Folders) or a Specific Category
        function renderView(viewId) {
            gridElement.innerHTML = ''; // Clear current grid
            currentViewId = viewId;

            if (viewId === 'home') {
                navBar.classList.add('hidden');
                
                // 1. Render Core Words first
                const coreWords = vocabulary.filter(item => item.category === 'home');
                coreWords.forEach(item => createButton(item, false));
                
                // 2. Render Folders
                categories.forEach(cat => createButton(cat, true));
                
                announcer.textContent = "Home screen loaded. Core words and categories available.";
            } else {
                // Show Navigation
                navBar.classList.remove('hidden');
                const categoryData = categories.find(c => c.id === viewId);
                currentCategoryTitle.textContent = categoryData ? categoryData.word : "Category";
                
                // Render words for this specific category
                const catWords = vocabulary.filter(item => item.category === viewId);
                
                if(catWords.length === 0) {
                    gridElement.innerHTML = `<p class="col-span-full text-center text-gray-500 py-10 text-xl font-bold">More words coming soon!</p>`;
                } else {
                    catWords.forEach(item => createButton(item, false));
                }
                
                announcer.textContent = `Opened ${currentCategoryTitle.textContent} category.`;
                
                // A11y: Move focus to the back button so they know they navigated
                setTimeout(() => btnHome.focus(), 50); 
            }
        }

        // Helper to create the UI buttons dynamically
        function createButton(item, isFolder) {
            const button = document.createElement('button');
            
            // Differentiate style if it's a folder vs a word
            const baseClasses = `aac-btn ${item.type} rounded-xl p-2 md:p-3 flex flex-col items-center justify-center focus:outline-none w-full relative`;
            const heightClass = isFolder ? 'min-h-[110px] md:min-h-[130px]' : 'min-h-[100px] md:min-h-[120px]';
            button.className = `${baseClasses} ${heightClass}`;
            
            // Screen reader specifics
            const roleAction = isFolder ? `Open ${item.word} folder` : `Say ${item.word}`;
            button.setAttribute('aria-label', roleAction);
            
            // Folder Indicator Icon (Top right corner)
            const folderBadge = isFolder ? 
                `<div class="absolute top-1 right-2 text-gray-500 opacity-60"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:h-6 md:w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" /></svg></div>` : '';

            // Image with Fallback Emoji logic
            button.innerHTML = `
                ${folderBadge}
                <div class="h-10 w-10 md:h-14 md:w-14 mb-1 md:mb-2 flex items-center justify-center">
                    <img src="${item.file}" alt="" class="max-h-full max-w-full object-contain drop-shadow-sm" 
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="text-4xl md:text-5xl hidden items-center justify-center h-full w-full drop-shadow-md" aria-hidden="true">${item.fallback}</div>
                </div>
                <span class="font-bold text-sm md:text-lg text-center leading-tight drop-shadow-sm">${item.word}</span>
            `;
            
            button.onclick = () => {
                if (isFolder) {
                    speakText(item.word); // Read the folder name
                    renderView(item.id);  // Open the folder
                } else {
                    addWordToSentence(item); // Add word to sentence
                }
            };
            
            gridElement.appendChild(button);
        }

        
        function goHome() {
            renderView('home');
        }

        function addWordToSentence(item) {
            sentence.push(item);
            
            // Speak immediately for tactile/auditory correlation (Crucial for SLD)
            speakText(item.word);
            
            updateSentenceStrip();
            announcer.textContent = `${item.word} added.`;
        }

        function removeLastWord() {
            if(sentence.length > 0) {
                const removed = sentence.pop();
                updateSentenceStrip();
                announcer.textContent = `Removed ${removed.word}.`;
            }
        }

        function clearSentence() {
            if(sentence.length > 0){
                sentence = [];
                updateSentenceStrip();
                speakText("Cleared");
                announcer.textContent = "Sentence cleared";
            }
        }

        function updateSentenceStrip() {
            if (sentence.length === 0) {
                sentenceStrip.innerHTML = '';
                sentenceStrip.appendChild(emptyState);
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            sentenceStrip.innerHTML = '';
            
            sentence.forEach((item, index) => {
                const token = document.createElement('div');
                token.className = `${item.type} rounded-lg p-1 md:p-2 flex items-center gap-1 md:gap-2 shadow-sm animate-fade-in`;
                
                token.innerHTML = `
                    <div class="h-6 w-6 md:h-8 md:w-8 flex items-center justify-center">
                         <img src="${item.file}" alt="" class="max-h-full max-w-full object-contain" 
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <div class="text-lg md:text-xl hidden" aria-hidden="true">${item.fallback}</div>
                    </div>
                    <span class="font-bold text-xs md:text-base">${item.word}</span>
                `;
                sentenceStrip.appendChild(token);
            });
            
            // Auto-scroll to end
            sentenceStrip.scrollTop = sentenceStrip.scrollHeight;
        }

        function speakSentence() {
            if (sentence.length === 0) {
                speakText("Please select words first.");
                return;
            }
            
            const fullText = sentence.map(item => item.word).join(' ');
            speakText(fullText);
            announcer.textContent = `Speaking: ${fullText}`;
        }

        function speakText(text) {
            synth.cancel(); // Stop current speech
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.85; // Slightly slower for processing speed needs
            utterance.pitch = 1.0;
            
            synth.speak(utterance);
        }

        // Initialize on load
        window.onload = () => {
            renderView('home');
            
            // Warm up TTS
            if(synth.getVoices().length === 0) {
                synth.addEventListener('voiceschanged', () => {});
            }
        };
